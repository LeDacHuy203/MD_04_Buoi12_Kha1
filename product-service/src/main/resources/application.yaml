server:
  port: 8080

spring:
  application:
    name: product-service

  # Cấu hình PostgreSQL kết nối tới Docker Desktop
  datasource:
    url: jdbc:postgresql://localhost:5432/product_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Cấu hình Redis kết nối tới Docker Desktop
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
